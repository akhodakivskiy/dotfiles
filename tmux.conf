# zsh default shell
set-option -g default-command $SHELL
set-option -g default-shell $SHELL

# Vim-like pane navigation (Prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H swap-pane -D
bind L swap-pane -U

# -- Basic Settings ------------------------------------------
set -g prefix C-b
set -g history-limit 10000

# Use vim bindings
setw -g mode-keys vi

# Set colors
set -g default-terminal "tmux-256color"

# Use mouse
set -g mouse on

# Count sessions start at 1
set -g base-index 1
setw -g pane-base-index 1

# Don't rename windows
set -g allow-rename off

# Set the title bar
set -g set-titles on
set -g set-titles-string '#(whoami) :: #h'

# -- Status Bar ---------------------------------------------
set -g status-bg black
set -g status-fg white
set -g status-interval 5
set -g status-left-length 90
set -g status-right-length 60
set -g status-left "#[fg=Green]#(whoami)#[fg=white]::#[fg=blue]#(hostname -s)#[fg=white]::"
set -g status-justify left
set -g status-right '#{?client_prefix,#[reverse]C-b#[noreverse],} #[fg=Cyan]#S #[fg=white]%a %d %b %R'

# kitty graphics (icat) passthrough
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# -- Plugins -----------------------------------------------
# escape-time is left to tmux (10ms since 3.5) / tmux-sensible (0 on older tmux).
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Other plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
