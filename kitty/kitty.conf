# kitty config. Full option reference: https://sw.kovidgoyal.net/kitty/conf/

font_family 0xProto Nerd Font Mono
font_size 12.0

cursor_shape block
cursor_shape_unfocused hollow

window_margin_width 5

shell_integration no-cursor

# Per-machine overrides (font size, etc.). Untracked; ignored if absent.
globinclude local.conf

# Managed by `kitten themes`; keep the markers.
# BEGIN_KITTY_THEME
# Alacritty
include current-theme.conf
# END_KITTY_THEME
