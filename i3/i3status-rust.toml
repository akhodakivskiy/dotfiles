[theme]
theme = "native"

[icons]
icons = "material-nf"

[[block]]
block = "keyboard_layout"
driver = "setxkbmap"
format = " $layout "

[[block]]
block = "cpu"

[[block]]
block = "memory"

[[block]]
block = "disk_space"
path = "/"
format = " $icon $available "

[[block]]
block = "net"
format = " $icon {$signal_strength $ssid |$ip} "

[[block]]
block = "net"
interval = 1
format = " $icon ↓$speed_down.eng(prefix:K) $graph_down ↑$speed_up.eng(prefix:K) $graph_up "

[[block]]
block = "battery"
driver = "upower"
device = "DisplayDevice" # UPower's combined battery; no per-machine name
interval = 10
format = "$icon $power $percentage"
charging_format = "$icon $power $percentage"
full_format = "$icon $percentage"
# You can also use other placeholders like {time_remaining}

[[block]]
block = "time"
format = " $timestamp.datetime(f:'%a %Y-%m-%d %H:%M') "
interval = 5
